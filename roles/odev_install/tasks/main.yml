---
- name: Check supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
    fail_msg: "Error: odev requires Ubuntu"

- name: Run Oreol CLI installer
  when: not ansible_check_mode
  block:
    - name: Create temporary installer file
      ansible.builtin.tempfile:
        state: file
        suffix: -odev-install.sh
      register: odev_install_file

    - name: Download Oreol CLI installer
      ansible.builtin.get_url:
        url: "{{ odev_install_url }}"
        dest: "{{ odev_install_file.path }}"
        headers:
          Cache-Control: no-cache
        force: true
        mode: "0600"
      register: odev_install_download
      until: odev_install_download is succeeded
      retries: 3
      delay: 5

    - name: Execute Oreol CLI installer
      ansible.builtin.shell:
        cmd: |
          umask 077
          rm -f /var/log/odev-install.exit
          # Keep logs private without restricting files created by the installer.
          (umask 022; bash {{ odev_install_file.path | quote }}) > /var/log/odev-install.log 2>&1
          rc=$?
          printf '%s\n' "$rc" > /var/log/odev-install.exit
          exit "$rc"
        executable: /bin/bash
      async: "{{ odev_install_timeout }}"
      poll: 15
      environment:
        TERM: xterm
        DEBIAN_FRONTEND: noninteractive
      changed_when: true
  always:
    - name: Remove temporary installer file
      ansible.builtin.file:
        path: "{{ odev_install_file.path }}"
        state: absent
      when: odev_install_file is defined and odev_install_file.path is defined
