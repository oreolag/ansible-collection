---
- name: Resolve a unique storage server
  ansible.builtin.assert:
    that:
      - matching | length == 1
    fail_msg: "Unknown or duplicate storage server {{ odev_storage_mount_assignment.server }}."
  vars:
    matching: "{{ odev_storage_mount_servers | selectattr('name', 'equalto', odev_storage_mount_assignment.server) | list }}"

- name: Resolve share configuration
  ansible.builtin.set_fact:
    odev_storage_mount_server: "{{ odev_storage_mount_servers | selectattr('name', 'equalto', odev_storage_mount_assignment.server) | first }}"

- name: Validate the share reference
  ansible.builtin.assert:
    that:
      - odev_storage_mount_assignment.share in odev_storage_mount_server.shares
    fail_msg: "Unknown share {{ odev_storage_mount_assignment.server }}/{{ odev_storage_mount_assignment.share }}."

- name: Validate share state and NFS endpoint
  ansible.builtin.assert:
    that:
      - share.type == 'nfs'
      - share.state in ['present', 'absent']
      - odev_storage_mount_assignment.state == 'absent' or share.state == 'present'
      - odev_storage_mount_server.ip is string
      - odev_storage_mount_server.ip is match('^[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+$')
      - share.export is match('^/[a-zA-Z0-9_-]+(/[a-zA-Z0-9_-]+)*$')
    fail_msg: "Invalid NFS endpoint, unsupported type, or present mount referencing an absent share."
  vars:
    share: "{{ odev_storage_mount_server.shares[odev_storage_mount_assignment.share] }}"

- name: Record the resolved mount
  ansible.builtin.set_fact:
    odev_storage_mount_resolved: >-
      {{ odev_storage_mount_resolved + [{'path': odev_storage_mount_assignment.mount_path,
          'source': odev_storage_mount_server.ip ~ ':' ~ odev_storage_mount_server.shares[odev_storage_mount_assignment.share].export,
          'state': odev_storage_mount_assignment.state}] }}
