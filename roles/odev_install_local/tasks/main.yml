---
- name: Require local file installation rather than repository installation
  ansible.builtin.assert:
    that:
      - not (repo | default(false) | bool)
    fail_msg: "odev_install_local does not support repo=true; select local components such as main, src, or booking."

- name: Validate the local CLI checkout before installation
  oreol.mgmt.odev_local_playbook:
    local_path: "{{ (cli | default({})).local_path | default('') }}"
    validate_only: true

- name: Run the local CLI installation with MGMT's ansible-play.sh
  oreol.mgmt.odev_local_playbook:
    local_path: "{{ cli.local_path }}"
  run_once: true
