---

- hosts: all
  become: true
  become_method: community.general.sudosu
  become_user: root
  ignore_unreachable: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
    # control variables
    update: false
  vars_files: vars.yml
  tasks:
    - name: Show control variables
      ansible.builtin.debug:
        msg:
          - "update={{ update }}"
      run_once: true
      delegate_to: localhost
    - include_tasks: ./tasks/passwordless-sudo-groupadd.yml