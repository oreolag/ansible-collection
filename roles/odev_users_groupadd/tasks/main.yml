---
- name: Validate user names and explicit states
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.name is defined
      - item.name is string
      - item.name is match('^[a-z_][a-z0-9_-]*[$]?$')
      - item.state is defined
      - item.state in ['present', 'absent']
    fail_msg: "Each user must have a valid name and state (present or absent)."
  loop: "{{ odev_users_groupadd_users }}"


- name: Ensure group odev-users exists
  ansible.builtin.group:
    state: present
    name: odev-users

- name: Check if user exists
  ansible.builtin.command: getent passwd "{{ item.name }}"
  register: user_check
  failed_when: user_check.rc not in [0, 2]
  check_mode: false
  changed_when: false
  loop: "{{ odev_users_groupadd_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Filter users that exist
  ansible.builtin.set_fact:
    existing_odev_users_users: >-
      {{ odev_users_groupadd_users | zip(user_check.results)
        | selectattr('1.rc', 'equalto', 0)
        | map('first') | list }}
    missing_odev_users_users: >-
      {{ odev_users_groupadd_users | zip(user_check.results)
        | rejectattr('1.rc', 'equalto', 0)
        | map('first') | list }}

- name: Add users to group odev-users
  ansible.builtin.user:
    name: "{{ item.name }}"
    append: true
    groups: odev-users
  loop: "{{ existing_odev_users_users }}"
  when: item.state == 'present'

- name: Read current odev-users supplementary members
  ansible.builtin.getent:
    database: group
    key: odev-users

- name: Remove users marked absent from odev-users
  ansible.builtin.command:
    argv: [gpasswd, -d, "{{ item.name }}", odev-users]
  loop: "{{ odev_users_groupadd_users }}"
  when:
    - item.state == 'absent'
    - item.name in ansible_facts.getent_group['odev-users'][2].split(',')
  changed_when: true

- name: Report missing users
  ansible.builtin.debug:
    msg: >-
      Users '{{ missing_odev_users_users }}' do not exist (LDAP/local user not found).
      Skipped.
      Consider removing them from the 'odev_users_groupadd_users' variable.
  when: (missing_odev_users_users| length) > 0

