---

- name: Ensure group odev-developers exists
  ansible.builtin.group:
    state: present
    name: odev-developers

- name: Check if user exists
  ansible.builtin.command: getent passwd "{{ item }}"
  register: user_check
  ignore_errors: true
  changed_when: false
  loop: "{{ users.odev_developers }}"
  loop_control:
    label: "{{ item }}"

- name: Filter users that exist
  ansible.builtin.set_fact:
    existing_odev_users_users: >-
      {{ users.odev_developers | zip(user_check.results)
        | selectattr('1.rc', 'equalto', 0)
        | map('first') | list }}
    missing_odev_users_users: >-
      {{ users.odev_developers | zip(user_check.results)
        | rejectattr('1.rc', 'equalto', 0)
        | map('first') | list }}

- name: Update (remove all users from group odev-developers first)
  ansible.builtin.command: gpasswd -M "" odev-developers
  become: true
  when:
    - update | bool

- name: Add users to group odev-developers
  ansible.builtin.user:
    name: "{{ item }}"
    append: true
    groups: odev-developers
  loop: "{{ existing_odev_users_users }}"

- name: Report missing users
  ansible.builtin.debug:
    msg: >-
      Users '{{ missing_odev_users_users }}' do not exist (LDAP/local user not found).
      Skipped.
      Consider removing them from the 'users.odev_developers' variable.
  when: (missing_odev_users_users| length) > 0

