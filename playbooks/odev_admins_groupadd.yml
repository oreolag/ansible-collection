---
- name: Configure odev-admins group
  hosts: "{{ oreol_target }}"
  become: true
  ignore_errors: true

  pre_tasks:
    - name: Show control variables
      ansible.builtin.debug:
        msg:
          - "update={{ update }}"
      run_once: true
      delegate_to: localhost

  roles:
    - oreol.mgmt.odev_admins_groupadd
