---
- name: Show control variables
  ansible.builtin.debug:
    msg: "update={{ update | bool }}"
  run_once: true

- name: Ensure passwordless-sudo group exists
  ansible.builtin.group:
    name: passwordless-sudo
    state: present

- name: Check whether each CMDB user exists
  ansible.builtin.command:
    argv:
      - getent
      - passwd
      - "{{ item }}"
  register: user_check
  changed_when: false
  failed_when: user_check.rc not in [0, 2]
  loop: "{{ users.passwordless_sudo }}"
  loop_control:
    label: "{{ item }}"

- name: Clear existing passwordless-sudo group membership
  ansible.builtin.command:
    argv:
      - gpasswd
      - -M
      - ""
      - passwordless-sudo
  when: update | bool

- name: Add existing CMDB users to passwordless-sudo group
  ansible.builtin.user:
    name: "{{ item.item }}"
    groups: passwordless-sudo
    append: true
  loop: "{{ user_check.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc == 0

- name: Report missing CMDB users
  ansible.builtin.debug:
    msg: >-
      User '{{ item.item }}' does not exist (LDAP/local user not found).
      Skipped. Consider removing them from users.passwordless_sudo.
  loop: "{{ user_check.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc == 2

- name: Configure passwordless sudo
  ansible.builtin.copy:
    content: |
      %passwordless-sudo ALL=(ALL) NOPASSWD:ALL
    dest: /etc/sudoers.d/passwordless-sudo
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"