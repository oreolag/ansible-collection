---
- name: Check supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] in ['Ubuntu', 'Debian']
    fail_msg: "GitHub CLI updates require Ubuntu or Debian"

- name: Update installed GitHub CLI package
  ansible.builtin.apt:
    name: gh
    state: latest
    only_upgrade: true
    update_cache: true
