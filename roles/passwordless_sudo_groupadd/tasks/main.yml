---
- name: Validate user names and explicit states
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.name is defined
      - item.name is string
      - item.name is match('^[a-z_][a-z0-9_-]*[$]?$')
      - item.state is defined
      - item.state in ['present', 'absent']
    fail_msg: "Each user must have a valid name and state (present or absent)."
  loop: "{{ passwordless_sudo_groupadd_users }}"

- name: Ensure passwordless-sudo group exists
  ansible.builtin.group:
    name: passwordless-sudo
    state: present

- name: Check whether each CMDB user exists
  ansible.builtin.command:
    argv:
      - getent
      - passwd
      - "{{ item.name }}"
  check_mode: false
  register: user_check
  changed_when: false
  failed_when: user_check.rc not in [0, 2]
  loop: "{{ passwordless_sudo_groupadd_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Add existing CMDB users to passwordless-sudo group
  ansible.builtin.user:
    name: "{{ item.item.name }}"
    groups: passwordless-sudo
    append: true
  loop: "{{ user_check.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.rc == 0 and item.item.state == 'present'

- name: Read current passwordless-sudo supplementary members
  ansible.builtin.getent:
    database: group
    key: passwordless-sudo

- name: Remove users marked absent from passwordless-sudo
  ansible.builtin.command:
    argv: [gpasswd, -d, "{{ item.name }}", passwordless-sudo]
  loop: "{{ passwordless_sudo_groupadd_users }}"
  when:
    - item.state == 'absent'
    - item.name in ansible_facts.getent_group['passwordless-sudo'][2].split(',')
  changed_when: true

- name: Report missing CMDB users
  ansible.builtin.debug:
    msg: >-
      User '{{ item.item.name }}' does not exist (LDAP/local user not found).
      Skipped. Consider removing them from passwordless_sudo_groupadd_users.
  loop: "{{ user_check.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.rc == 2

- name: Configure passwordless sudo
  ansible.builtin.copy:
    content: |
      %passwordless-sudo ALL=(ALL) NOPASSWD:ALL
    dest: /etc/sudoers.d/passwordless-sudo
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
