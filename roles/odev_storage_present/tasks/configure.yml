---
- name: Read this server's configuration
  ansible.builtin.set_fact:
    odev_storage_present_config: "{{ odev_storage_present_matches[0] }}"
    odev_storage_present_clients: []

- name: Validate the storage configuration
  ansible.builtin.assert:
    that:
      - odev_storage_present_config.ip is string
      - odev_storage_present_config.ip is match('^[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+$')
      - odev_storage_present_config.path is match('^/[a-zA-Z0-9_-]+(/[a-zA-Z0-9_-]+)*$')
      - odev_storage_present_config.shares is sequence
      - odev_storage_present_config.shares is not string
      - odev_storage_present_config.shares is not mapping
      - odev_storage_present_config.shares | length > 0

- name: Validate share states and supported types before making changes
  ansible.builtin.assert:
    that:
      - item.name is match('^[a-zA-Z][a-zA-Z0-9_-]*$')
      - item.state is defined
      - item.state in ['present', 'absent']
      - item.type | default('') in ['nfs']
    fail_msg: "Share {{ item.name }} requires state: present/absent and type: nfs."
  loop: "{{ odev_storage_present_config.shares }}"

- name: Require unique share names
  ansible.builtin.assert:
    that:
      - odev_storage_present_config.shares | map(attribute='name') | unique | length == odev_storage_present_config.shares | length
    fail_msg: "Share names must be unique within each storage server."

- name: Configure NFS shares
  ansible.builtin.include_tasks: nfs.yml
  when: odev_storage_present_config.shares | selectattr('type', 'equalto', 'nfs') | list | length > 0
