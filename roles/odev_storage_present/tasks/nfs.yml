---
- name: Verify the actual machine hostname
  ansible.builtin.command:
    argv: [hostname, -s]
  register: odev_storage_present_hostname
  changed_when: false
  check_mode: false

- name: Reject an inventory entry pointing at another machine
  ansible.builtin.assert:
    that:
      - odev_storage_present_hostname.stdout == odev_storage_present_config.name
    fail_msg: "Connected to {{ odev_storage_present_hostname.stdout }}, expected {{ odev_storage_present_config.name }}."

- name: Read actual IPv4 addresses
  ansible.builtin.command:
    argv: [ip, -j, -4, address, show]
  register: odev_storage_present_addresses
  changed_when: false
  check_mode: false

- name: Verify the declared storage IP belongs to this machine
  ansible.builtin.assert:
    that:
      - odev_storage_present_config.ip in (odev_storage_present_addresses.stdout | from_json | map(attribute='addr_info') | flatten | map(attribute='local') | list)
    fail_msg: "The storage IP in cmdb/storage.yml does not belong to this machine."

- name: Read declared client assignments
  ansible.builtin.include_tasks: client.yml
  loop: "{{ query('ansible.builtin.fileglob', inventory_dir ~ '/cmdb/*.yml') | sort }}"
  loop_control:
    loop_var: odev_storage_present_client_file

- name: Verify login account identities across storage clients
  ansible.builtin.include_tasks: identities.yml
  vars:
    odev_storage_identity_peer_names: "{{ odev_storage_present_clients | map(attribute='host') | unique | list }}"
  when: odev_storage_present_config.shares | selectattr('state', 'equalto', 'present') | list | length > 0

- name: Install the NFS server
  ansible.builtin.apt:
    name: nfs-kernel-server
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create directories only for present shares
  ansible.builtin.file:
    path: "{{ odev_storage_present_config.path ~ '/' ~ item.name }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: "{{ odev_storage_present_config.shares | selectattr('state', 'equalto', 'present') | list }}"

- name: Create private login user directories on each present share
  ansible.builtin.file:
    path: "{{ odev_storage_present_config.path }}/{{ item.0.name }}/{{ item.1.item.name }}"
    state: directory
    owner: "{{ item.1.stdout.split(':')[2] }}"
    group: "{{ item.1.stdout.split(':')[3] }}"
    mode: '0700'
  loop: "{{ odev_storage_present_config.shares | selectattr('state', 'equalto', 'present') | list | product(odev_storage_identity_accounts.results | default([])) | list }}"
  loop_control:
    label: "{{ item.0.name }}/{{ item.1.item.name }}"

- name: Create the export configuration directory
  ansible.builtin.file:
    path: /etc/exports.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configure CMDB-managed exports
  ansible.builtin.template:
    src: shares.exports.j2
    dest: /etc/exports.d/odev.exports
    owner: root
    group: root
    mode: '0644'
  notify: Reload NFS exports

- name: Enable and start the NFS server
  ansible.builtin.systemd_service:
    name: nfs-kernel-server
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Apply export changes before verification
  ansible.builtin.meta: flush_handlers

- name: Read active NFS exports
  ansible.builtin.command:
    argv: [exportfs, -v]
  register: odev_storage_present_exports
  changed_when: false
  when: not ansible_check_mode

- name: Show active NFS exports
  ansible.builtin.debug:
    var: odev_storage_present_exports.stdout_lines
  when: not ansible_check_mode
