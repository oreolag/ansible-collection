---
- name: Resolve this server in the storage catalogue
  ansible.builtin.set_fact:
    odev_storage_present_matches: >-
      {{ (lookup('ansible.builtin.file', inventory_dir ~ '/cmdb/storage.yml') | from_yaml).servers
         | selectattr('name', 'equalto', inventory_hostname_short) | list }}

- name: Require unambiguous storage server assignments
  ansible.builtin.assert:
    that:
      - odev_storage_present_matches | length <= 1
    fail_msg: "{{ inventory_hostname }} matches duplicate storage servers in cmdb/storage.yml."

- name: Configure this machine only when declared as a storage server
  ansible.builtin.include_tasks: configure.yml
  when: odev_storage_present_matches | length == 1
